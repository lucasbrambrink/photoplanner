name: CI (JS, Python & Rust)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: raycaster -> target

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Rust photoplanner release binary
        run: cargo build --release --manifest-path raycaster/Cargo.toml --bin photoplanner

      - name: Check frontend JavaScript syntax
        run: node --check web/app.js

      - name: Run Python unit & ASGI integration tests
        run: python -m unittest discover -s tests -v

      - name: Run Rust workspace tests
        run: cargo test --manifest-path raycaster/Cargo.toml --workspace
